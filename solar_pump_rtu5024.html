<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0f1d" />
  <title>GSM Controller</title>
  
  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
          },
          colors: {
            glass: {
              card: 'rgba(15, 23, 42, 0.65)',
              border: 'rgba(255, 255, 255, 0.14)',
              green: 'rgba(16, 185, 129, 0.22)',
              red: 'rgba(239, 68, 68, 0.22)',
              amber: 'rgba(245, 158, 11, 0.22)',
              cyan: 'rgba(6, 182, 212, 0.2)',
            }
          },
          animation: {
            'blob-slow': 'blob 10s infinite',
            'blob-fast': 'blob 7s infinite',
            'pulse-glow': 'pulseGlow 2.5s infinite',
          },
          keyframes: {
            blob: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '33%': { transform: 'translate(30px, -40px) scale(1.12)' },
              '66%': { transform: 'translate(-25px, 20px) scale(0.92)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.8', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.05)' },
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }
    body {
      background: #090d16;
      background-image: linear-gradient(180deg, #090d16 0%, #0f172a 50%, #0a0f1d 100%);
      min-height: 100vh;
      color: #f8fafc;
      overflow-x: hidden;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.3), inset 0 -1px 2px 0 rgba(0, 0, 0, 0.35), 0 12px 32px 0 rgba(0, 0, 0, 0.45);
      border-radius: 26px;
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    .glass-input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.35), inset 0 1px 2px rgba(0, 0, 0, 0.4);
    }
    
    /* 1) TOP BUTTON: Emerald Green Glass */
    .glass-btn-start {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.38) 0%, rgba(5, 150, 105, 0.62) 100%);
      border: 1px solid rgba(110, 231, 183, 0.65);
      box-shadow: inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 2px 0 rgba(0, 0, 0, 0.3), 0 10px 28px rgba(16, 185, 129, 0.35);
      border-radius: 26px;
    }
    .glass-btn-start:active {
      transform: scale(0.97);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.3), 0 4px 14px rgba(16, 185, 129, 0.55);
    }
    
    /* 2) MIDDLE BUTTON: Crimson Red Glass */
    .glass-btn-stop {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.38) 0%, rgba(185, 28, 28, 0.62) 100%);
      border: 1px solid rgba(252, 165, 165, 0.65);
      box-shadow: inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 2px 0 rgba(0, 0, 0, 0.3), 0 10px 28px rgba(239, 68, 68, 0.35);
      border-radius: 26px;
    }
    .glass-btn-stop:active {
      transform: scale(0.97);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.3), 0 4px 14px rgba(239, 68, 68, 0.55);
    }

    /* 3) BOTTOM BUTTON: Yellow / Amber Glass */
    .glass-btn-call {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.38) 0%, rgba(217, 119, 6, 0.62) 100%);
      border: 1px solid rgba(253, 230, 138, 0.65);
      box-shadow: inset 0 1.5px 2px 0 rgba(255, 255, 255, 0.45), inset 0 -1px 2px 0 rgba(0, 0, 0, 0.3), 0 10px 28px rgba(245, 158, 11, 0.35);
      border-radius: 26px;
    }
    .glass-btn-call:active {
      transform: scale(0.97);
      box-shadow: inset 0 1px 1px 0 rgba(255, 255, 255, 0.3), 0 4px 14px rgba(245, 158, 11, 0.55);
    }

    .glass-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }
    
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.2);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="selection:bg-cyan-500 selection:text-white">
  <!-- Simple & Static Dark Backdrop -->
  <div class="fixed inset-0 pointer-events-none z-0 bg-gradient-to-b from-[#090d16] via-[#0f172a] to-[#0a0f1d]"></div>

  <!-- React Root -->
  <div id="root" class="relative z-10"></div>

  <!-- React Application Logic -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // 1. Defaults: Passcode 1234, Phone 0600000000
      const [phoneNumber, setPhoneNumber] = useState(() => localStorage.getItem('gsm_phone') || '0600000000');
      const [passcode, setPasscode] = useState(() => localStorage.getItem('gsm_passcode') || '1234');
      const [isConfigOpen, setIsConfigOpen] = useState(false);
      
      // Advanced config section toggle
      const [isAdvancedOpen, setIsAdvancedOpen] = useState(false);
      
      // Advanced RTU5024 Command States
      const [newPasscode, setNewPasscode] = useState('');
      const [authNumber, setAuthNumber] = useState('');
      const [authNumberPos, setAuthNumberPos] = useState('01');
      const [delNumber, setDelNumber] = useState('');
      const [relaySeconds, setRelaySeconds] = useState('0019');

      // Pump State (optimistic indicator)
      const [pumpStatus, setPumpStatus] = useState(() => localStorage.getItem('gsm_status') || 'unknown');
      
      // Custom Command input
      const [customCmd, setCustomCmd] = useState('');
      
      // Toast notification
      const [toast, setToast] = useState(null);

      // Activity Feed Logs
      const [logs, setLogs] = useState(() => {
        const saved = localStorage.getItem('gsm_logs');
        if (saved) {
          try { return JSON.parse(saved); } catch(e) {}
        }
        return [
          {
            id: 'init_1',
            timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
            title: 'جاهز للإرسال والاستقبال',
            command: 'جاهز (Ready)',
            type: 'system',
            mode: 'نظام'
          }
        ];
      });

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem('gsm_phone', phoneNumber);
        localStorage.setItem('gsm_passcode', passcode);
        localStorage.setItem('gsm_status', pumpStatus);
        localStorage.setItem('gsm_logs', JSON.stringify(logs.slice(0, 30)));
      }, [phoneNumber, passcode, pumpStatus, logs]);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      const addLog = (title, command, type = 'action', modeUsed = 'SMS') => {
        const newLog = {
          id: Date.now().toString(),
          timestamp: new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          title,
          command,
          type,
          mode: modeUsed
        };
        setLogs(prev => [newLog, ...prev.slice(0, 30)]);
      };

      const triggerHaptic = () => {
        if (window.navigator && window.navigator.vibrate) {
          try {
            window.navigator.vibrate([70, 50, 90]);
          } catch(e) {}
        }
      };

      // Timer States & Audio Alarm
      const [isTimerRunning, setIsTimerRunning] = useState(() => {
        const endTime = localStorage.getItem('gsm_timer_end');
        return !!(endTime && Number(endTime) > Date.now());
      });
      const [targetEndTime, setTargetEndTime] = useState(() => {
        const endTime = localStorage.getItem('gsm_timer_end');
        return endTime ? Number(endTime) : 0;
      });
      const [timerDurationSecs, setTimerDurationSecs] = useState(() => {
        const d = localStorage.getItem('gsm_timer_duration');
        return d ? Number(d) : 1800;
      });
      const [remainingSecs, setRemainingSecs] = useState(0);
      const [isAlarmRinging, setIsAlarmRinging] = useState(false);
      const [showCustomTimerModal, setShowCustomTimerModal] = useState(false);
      const [customH, setCustomH] = useState('');
      const [customM, setCustomM] = useState('30');

      const audioCtxRef = React.useRef(null);
      const alarmTimerRef = React.useRef(null);

      const playAlarmBeep = () => {
        try {
          const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtxClass) return;
          if (!audioCtxRef.current) audioCtxRef.current = new AudioCtxClass();
          if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();

          const ctx = audioCtxRef.current;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.35, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.38);
        } catch(e) {}
      };

      const startAlarmSound = () => {
        setIsAlarmRinging(true);
        playAlarmBeep();
        if (alarmTimerRef.current) clearInterval(alarmTimerRef.current);
        alarmTimerRef.current = setInterval(() => {
          playAlarmBeep();
          if (navigator.vibrate) navigator.vibrate([400, 200, 400]);
        }, 850);
      };

      const stopAlarmSound = () => {
        setIsAlarmRinging(false);
        if (alarmTimerRef.current) {
          clearInterval(alarmTimerRef.current);
          alarmTimerRef.current = null;
        }
      };

      // Realtime countdown ticker
      useEffect(() => {
        if (!isTimerRunning || !targetEndTime) return;

        const checkTime = () => {
          const now = Date.now();
          const left = Math.round((targetEndTime - now) / 1000);
          if (left <= 0) {
            setRemainingSecs(0);
            setIsTimerRunning(false);
            localStorage.removeItem('gsm_timer_end');
            startAlarmSound();
            addLog('انتهاء مؤقت التشغيل', 'رنين منبه إيقاف المضخة', 'stop', 'مؤقت');
          } else {
            setRemainingSecs(left);
          }
        };

        checkTime();
        const interval = setInterval(checkTime, 1000);
        return () => clearInterval(interval);
      }, [isTimerRunning, targetEndTime]);

      const startTimer = (seconds) => {
        stopAlarmSound();
        const end = Date.now() + (seconds * 1000);
        setTimerDurationSecs(seconds);
        setTargetEndTime(end);
        setRemainingSecs(seconds);
        setIsTimerRunning(true);
        localStorage.setItem('gsm_timer_duration', seconds);
        localStorage.setItem('gsm_timer_end', end);
        showToast(`تم بدء المؤقت: ${formatTime(seconds)}`);
      };

      const cancelTimer = () => {
        setIsTimerRunning(false);
        setTargetEndTime(0);
        setRemainingSecs(0);
        localStorage.removeItem('gsm_timer_end');
        stopAlarmSound();
        showToast('تم إلغاء المؤقت');
      };

      const extendTimer = (secs) => {
        if (isTimerRunning) {
          const newEnd = targetEndTime + (secs * 1000);
          const newDur = timerDurationSecs + secs;
          setTargetEndTime(newEnd);
          setTimerDurationSecs(newDur);
          setRemainingSecs(prev => prev + secs);
          localStorage.setItem('gsm_timer_end', newEnd);
          localStorage.setItem('gsm_timer_duration', newDur);
          showToast(`تم تمديد المؤقت بمقدار ${Math.round(secs/60)} دقيقة`);
        } else {
          startTimer(secs);
        }
      };

      const formatTime = (secs) => {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = secs % 60;
        if (h > 0) {
          return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const formatEndTime = (millis) => {
        if (!millis) return '';
        const d = new Date(millis);
        return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      };

      // Execute Call (tel:)
      const makeCall = () => {
        triggerHaptic();
        if (!phoneNumber || phoneNumber.trim() === '') {
          showToast('يرجى إدخال رقم الشريحة أولاً في الإعدادات', 'error');
          setIsConfigOpen(true);
          return;
        }

        if (window.AndroidInterface && window.AndroidInterface.dialNumber) {
          window.AndroidInterface.dialNumber(phoneNumber);
        } else {
          window.location.href = `tel:${phoneNumber.replace(/[\s-]/g, '')}`;
        }
      };

      // Execute SMS (sms:)
      const sendSms = (smsBody) => {
        triggerHaptic();
        if (!phoneNumber || phoneNumber.trim() === '') {
          showToast('يرجى إدخال رقم الشريحة أولاً في الإعدادات', 'error');
          setIsConfigOpen(true);
          return;
        }

        if (window.AndroidInterface && window.AndroidInterface.sendSms) {
          window.AndroidInterface.sendSms(phoneNumber, smsBody);
        } else {
          const cleanPhone = phoneNumber.replace(/[\s-]/g, '');
          const encoded = encodeURIComponent(smsBody);
          const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
          const delimiter = isIOS ? '&' : '?';
          window.location.href = `sms:${cleanPhone}${delimiter}body=${encoded}`;
        }
      };

      // 1) TOP BUTTON: START PUMP (SMS: [PASSCODE]#ON#)
      const handleStartSms = () => {
        triggerHaptic();
        const cmd = `${passcode}#ON#`;
        addLog('تشغيل المضخة (SMS)', cmd, 'start', 'SMS');
        showToast(`تجهيز أمر التشغيل: ${cmd}`);
        setPumpStatus('running');
        sendSms(cmd);
      };

      // 2) MIDDLE BUTTON: STOP PUMP (SMS: [PASSCODE]#OFF#)
      const handleStopSms = () => {
        triggerHaptic();
        const cmd = `${passcode}#OFF#`;
        addLog('إيقاف المضخة (SMS)', cmd, 'stop', 'SMS');
        showToast(`تجهيز أمر الإيقاف: ${cmd}`);
        setPumpStatus('stopped');
        sendSms(cmd);
      };

      // 3) BOTTOM BUTTON: CALL PUMP (tel:)
      const handleCallPump = () => {
        triggerHaptic();
        addLog('تشغيل عن طريق الاتصال', `اتصال بالرقم ${phoneNumber}`, 'call', 'اتصال');
        showToast('جاري الاتصال بالرقم...');
        setPumpStatus('running');
        makeCall();
      };

      // Quick Diagnostics
      const handleCheckStatus = () => {
        triggerHaptic();
        const cmd = `${passcode}#EE#`;
        addLog('فحص الحالة', cmd, 'info', 'SMS');
        showToast(`طلب الحالة: ${cmd}`);
        sendSms(cmd);
      };

      const handleCheckTimer = () => {
        triggerHaptic();
        const cmd = `${passcode}#T#`;
        addLog('فحص مؤقت التتابع', cmd, 'info', 'SMS');
        showToast(`فحص المؤقت: ${cmd}`);
        sendSms(cmd);
      };

      const handleCheckSignal = () => {
        triggerHaptic();
        const cmd = `${passcode}#CSQ?`;
        addLog('فحص جودة الإشارة', cmd, 'info', 'SMS');
        showToast(`فحص الإشارة: ${cmd}`);
        sendSms(cmd);
      };

      // Advanced RTU5024 Configuration Triggers
      const handleSetupPassword = (e) => {
        e.preventDefault();
        if (!newPasscode || newPasscode.length !== 4) {
          showToast('يرجى كتابة رمز مرور جديد مكون من 4 أرقام', 'error');
          return;
        }
        triggerHaptic();
        const cmd = `${passcode}#PWD${newPasscode}#PWD${newPasscode}#`;
        addLog('تغيير رمز المرور', cmd, 'config', 'SMS');
        showToast(`إرسال أمر تغيير الرمز: ${cmd}`);
        sendSms(cmd);
        setNewPasscode('');
      };

      const handleAddAuthNumber = (e) => {
        e.preventDefault();
        if (!authNumber.trim()) {
          showToast('يرجى إدخال رقم الهاتف المراد تفويضه', 'error');
          return;
        }
        triggerHaptic();
        const cleanNumber = authNumber.replace(/[\s-]/g, '');
        const pos = authNumberPos.padStart(2, '0');
        const cmd = `${passcode}#TEL${cleanNumber}#${pos}#`;
        addLog('إضافة رقم مصرح له', cmd, 'config', 'SMS');
        showToast(`إرسال تفويض الرقم: ${cmd}`);
        sendSms(cmd);
        setAuthNumber('');
      };

      const handleDeleteAuthNumber = (e) => {
        e.preventDefault();
        if (!delNumber.trim()) {
          showToast('يرجى إدخال الرقم المراد حذفه', 'error');
          return;
        }
        triggerHaptic();
        const cleanNumber = delNumber.replace(/[\s-]/g, '');
        const cmd = `${passcode}#DEL${cleanNumber}#`;
        addLog('حذف رقم مصرح له', cmd, 'config', 'SMS');
        showToast(`إرسال حذف الرقم: ${cmd}`);
        sendSms(cmd);
        setDelNumber('');
      };

      const handleSetRelayTime = (e) => {
        e.preventDefault();
        if (!relaySeconds.trim()) return;
        triggerHaptic();
        const cleanSec = relaySeconds.padStart(4, '0');
        const cmd = `${passcode}#GOT${cleanSec}#`;
        addLog('ضبط وقت التتابع', cmd, 'config', 'SMS');
        showToast(`إرسال ضبط الوقت: ${cmd}`);
        sendSms(cmd);
      };

      const handleAllowAllCallers = () => {
        triggerHaptic();
        const cmd = `${passcode}#AA#`;
        addLog('السماح لجميع المتصلين', cmd, 'config', 'SMS');
        showToast(`تفعيل استجابة جميع الأرقام: ${cmd}`);
        sendSms(cmd);
      };

      const handleAuthorizedOnly = () => {
        triggerHaptic();
        const cmd = `${passcode}#AU#`;
        addLog('المتصلون المصرح لهم فقط', cmd, 'config', 'SMS');
        showToast(`تفعيل الأرقام المصرح بها فقط: ${cmd}`);
        sendSms(cmd);
      };

      const handleResetFactory = () => {
        if (!window.confirm('هل أنت متأكد من إعادة ضبط مصنع RTU5024؟ سيتم مسح جميع الأرقام والعودة لرمز 1234.')) {
          return;
        }
        triggerHaptic();
        const cmd = `${passcode}#RESET#`;
        addLog('إعادة ضبط المصنع', cmd, 'config', 'SMS');
        showToast(`أمر ضبط المصنع: ${cmd}`);
        sendSms(cmd);
      };

      // Custom Command (Format: [PASSCODE]#[CUSTOM_CMD])
      const handleSendCustomCmd = (e) => {
        e.preventDefault();
        if (!customCmd.trim()) return;
        triggerHaptic();
        const raw = customCmd.trim();
        const fullCmd = raw.startsWith(passcode + '#') ? raw : `${passcode}#${raw}`;
        addLog('أمر مخصص مرسل', fullCmd, 'custom', 'SMS');
        showToast(`إرسال: ${fullCmd}`);
        sendSms(fullCmd);
        setCustomCmd('');
      };

      const clearLogs = () => {
        setLogs([]);
        showToast('تم مسح سجل العمليات');
      };

      return (
        <div className="min-h-screen max-w-lg mx-auto px-4 py-5 pb-16 flex flex-col gap-4">
          
          {/* 1. Header Bar: Custom Brand Logo + Title "GSM Controller" + Settings Gear Icon */}
          <header className="glass-panel rounded-2xl px-5 py-4 flex items-center justify-between border-cyan-500/20 shadow-lg">
            <div className="flex items-center gap-3">
              <div className="w-12 h-12 rounded-xl bg-white/10 border border-cyan-400/30 flex items-center justify-center shadow-inner relative overflow-hidden p-1">
                <img src="gsm_logo.png" onError={(e) => { e.currentTarget.src = "public/assets/gsm_logo.png"; }} alt="GSM Controller Logo" className="w-full h-full object-contain" />
              </div>
              <div>
                <h1 className="text-xl font-black text-white tracking-wide">GSM Controller</h1>
                <div className="flex items-center gap-2 mt-0.5">
                  <span className="text-[11px] font-mono text-cyan-300/80 tracking-wider">
                    {phoneNumber || 'الرقم غير محدد'}
                  </span>
                </div>
              </div>
            </div>

            {/* Top Header Action: Settings Gear Icon */}
            <button
              onClick={() => setIsConfigOpen(!isConfigOpen)}
              className="p-2.5 rounded-xl glass-badge hover:bg-white/10 active:scale-95 transition text-slate-300 hover:text-white"
              title="إعدادات الشريحة ورمز PIN"
            >
              <svg className="w-5 h-5 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                      dir="ltr"
                      value={newPasscode}
                      onChange={(e) => setNewPasscode(e.target.value)}
                      placeholder="رمز جديد (مثال: 5678)"
                      className="flex-1 rounded-xl px-3 py-2 text-xs glass-input font-mono text-center tracking-widest text-emerald-300"
                    />
                    <button
                      type="submit"
                      className="px-3.5 py-2 rounded-xl bg-cyan-600/40 hover:bg-cyan-600/60 text-white font-bold text-xs border border-cyan-400/40 active:scale-95 transition"
                    >
                      إرسال الرمز
                    </button>
                  </div>
                </form>

                {/* 4.2 Add Authorized Number: [PASSCODE]#TEL[NUMBER]#[POS]# */}
                <form onSubmit={handleAddAuthNumber} className="p-3 rounded-xl bg-white/5 border border-white/5 space-y-2">
                  <div className="font-semibold text-slate-300 flex items-center justify-between">
                    <span>2. إضافة رقم مصرح له (موقع 01):</span>
                    <span className="text-[10px] text-slate-400 font-mono">#TEL[رقم]#[موقع]#</span>
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="tel"
                      dir="ltr"
                      value={authNumber}
                      onChange={(e) => setAuthNumber(e.target.value)}
                      placeholder="رقم الهاتف (06XXXXXXXX)"
                      className="flex-1 rounded-xl px-3 py-2 text-xs glass-input font-mono text-center"
                    />
                    <input
                      type="text"
                      maxLength="3"
                      dir="ltr"
                      value={authNumberPos}
                      onChange={(e) => setAuthNumberPos(e.target.value)}
                      placeholder="01"
                      className="w-14 rounded-xl px-2 py-2 text-xs glass-input font-mono text-center text-cyan-300"
                      title="موقع الرقم في الذاكرة (01-999)"
                    />
                    <button
                      type="submit"
                      className="px-3 py-2 rounded-xl bg-emerald-600/40 hover:bg-emerald-600/60 text-white font-bold text-xs border border-emerald-400/40 active:scale-95 transition"
                    >
                      إضافة
                    </button>
                  </div>
                </form>

                {/* 4.3 Delete Authorized Number: [PASSCODE]#DEL[NUMBER]# */}
                <form onSubmit={handleDeleteAuthNumber} className="p-3 rounded-xl bg-white/5 border border-white/5 space-y-2">
                  <div className="font-semibold text-slate-300 flex items-center justify-between">
                    <span>3. حذف رقم مصرح له:</span>
                    <span className="text-[10px] text-slate-400 font-mono">#DEL[رقم]#</span>
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="tel"
                      dir="ltr"
                      value={delNumber}
                      onChange={(e) => setDelNumber(e.target.value)}
                      placeholder="رقم الهاتف المراد حذفه"
                      className="flex-1 rounded-xl px-3 py-2 text-xs glass-input font-mono text-center"
                    />
                    <button
                      type="submit"
                      className="px-3.5 py-2 rounded-xl bg-rose-600/40 hover:bg-rose-600/60 text-white font-bold text-xs border border-rose-400/40 active:scale-95 transition"
                    >
                      حذف
                    </button>
                  </div>
                </form>

                {/* 4.4 Setup Relay Time (GOT): [PASSCODE]#GOT[SECONDS]# */}
                <form onSubmit={handleSetRelayTime} className="p-3 rounded-xl bg-white/5 border border-white/5 space-y-2">
                  <div className="font-semibold text-slate-300 flex items-center justify-between">
                    <span>4. ضبط وقت وصل المرحل (بالثواني):</span>
                    <span className="text-[10px] text-slate-400 font-mono">#GOT[0000-9999]#</span>
                  </div>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      maxLength="4"
                      dir="ltr"
                      value={relaySeconds}
                      onChange={(e) => setRelaySeconds(e.target.value)}
                      placeholder="مثال: 0019 (19 ثانية)"
                      className="flex-1 rounded-xl px-3 py-2 text-xs glass-input font-mono text-center text-amber-300 tracking-wider"
                    />
                    <button
                      type="submit"
                      className="px-3.5 py-2 rounded-xl bg-amber-600/40 hover:bg-amber-600/60 text-white font-bold text-xs border border-amber-400/40 active:scale-95 transition"
                    >
                      حفظ الوقت
                    </button>
                  </div>
                </form>

                {/* 4.5 Caller Permission Modes: Allow All (AA) vs Authorized Only (AU) */}
                <div className="p-3 rounded-xl bg-white/5 border border-white/5 space-y-2">
                  <div className="font-semibold text-slate-300">5. صلاحيات الاتصال والتحكم:</div>
                  <div className="grid grid-cols-2 gap-2">
                    <button
                      type="button"
                      onClick={handleAllowAllCallers}
                      className="py-2.5 px-2 rounded-xl bg-blue-600/30 hover:bg-blue-600/50 text-white font-semibold text-xs border border-blue-400/30 active:scale-95 transition text-center"
                    >
                      <div>السماح للجميع</div>
                      <div className="text-[10px] text-blue-300 font-mono mt-0.5">{passcode}#AA#</div>
                    </button>

                    <button
                      type="button"
                      onClick={handleAuthorizedOnly}
                      className="py-2.5 px-2 rounded-xl bg-emerald-600/30 hover:bg-emerald-600/50 text-white font-semibold text-xs border border-emerald-400/30 active:scale-95 transition text-center"
                    >
                      <div>المصرح لهم فقط (افتراضي)</div>
                      <div className="text-[10px] text-emerald-300 font-mono mt-0.5">{passcode}#AU#</div>
                    </button>
                  </div>
                </div>

                {/* 4.6 Reset Factory Default: [PASSCODE]#RESET# */}
                <div className="p-3 rounded-xl bg-rose-950/20 border border-rose-500/20">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="font-bold text-rose-300">إعادة ضبط المصنع بالكامل:</div>
                      <div className="text-[10px] text-slate-400">يمسح جميع الأرقام المسجلة ويرجع رمز 1234</div>
                    </div>
                    <button
                      type="button"
                      onClick={handleResetFactory}
                      className="px-3.5 py-2 rounded-xl bg-rose-600/40 hover:bg-rose-600/70 text-rose-100 font-bold text-xs border border-rose-400/50 active:scale-95 transition"
                    >
                      إعادة الضبط
                    </button>
                  </div>
                </div>

              </div>
            )}
          </div>

          {/* 5. CUSTOM SMS COMMAND INPUT (At the Bottom) */}
          <div className="glass-panel rounded-2xl p-4">
            <div className="text-xs font-bold text-slate-300 mb-2 flex items-center justify-between">
              <span className="flex items-center gap-1.5">
                <svg className="w-4 h-4 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                </svg>
                <span>أمر SMS مخصص (Custom Command):</span>
              </span>
              <span className="text-[10px] text-slate-400 font-mono">{passcode}#[الأمر]</span>
            </div>

            <form onSubmit={handleSendCustomCmd} className="flex gap-2">
              <input
                type="text"
                dir="ltr"
                value={customCmd}
                onChange={(e) => setCustomCmd(e.target.value)}
                placeholder="أدخل نص الأمر (مثال: ON# أو OFF#)"
                className="flex-1 rounded-xl px-3.5 py-2.5 text-xs glass-input font-mono text-cyan-200"
              />
              <button
                type="submit"
                className="px-4 py-2.5 rounded-xl bg-purple-600/40 hover:bg-purple-600/60 text-white font-bold text-xs border border-purple-400/40 active:scale-95 transition flex items-center gap-1"
              >
                <span>إرسال</span>
                <svg className="w-3.5 h-3.5 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
              </button>
            </form>
          </div>

          {/* Live Activity Feed */}
          <div className="glass-panel rounded-2xl p-4 flex-1 flex flex-col min-h-[160px]">
            <div className="flex items-center justify-between mb-3">
              <div className="flex items-center gap-2">
                <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <h3 className="font-bold text-sm text-white">سجل العمليات المباشر</h3>
              </div>
              {logs.length > 0 && (
                <button
                  onClick={clearLogs}
                  className="text-[11px] text-slate-400 hover:text-rose-400 transition"
                >
                  مسح السجل
                </button>
              )}
            </div>

            <div className="space-y-2 overflow-y-auto max-h-56 pr-1">
              {logs.length === 0 ? (
                <div className="py-6 text-center text-xs text-slate-500">
                  لا توجد عمليات مسجلة حتى الآن
                </div>
              ) : (
                logs.map((item) => (
                  <div
                    key={item.id}
                    className="p-2.5 rounded-xl bg-white/5 border border-white/5 flex items-start justify-between gap-3 text-xs"
                  >
                    <div className="flex items-start gap-2">
                      <span className={`mt-0.5 w-2 h-2 rounded-full shrink-0 ${
                        item.type === 'start' ? 'bg-emerald-400' :
                        item.type === 'stop' ? 'bg-rose-400' :
                        item.type === 'call' ? 'bg-amber-400' :
                        item.type === 'info' ? 'bg-cyan-400' : 'bg-purple-400'
                      }`}></span>
                      <div>
                        <div className="font-semibold text-white">{item.title}</div>
                        <div className="text-[11px] font-mono text-cyan-300/80 mt-0.5" dir="ltr">{item.command}</div>
                      </div>
                    </div>
                    <div className="text-left shrink-0">
                      <div className="text-[10px] text-slate-400 font-mono">{item.timestamp}</div>
                      <span className="inline-block mt-0.5 text-[9px] px-1.5 py-0.5 rounded bg-white/10 text-slate-300">
                        {item.mode}
                      </span>
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed bottom-5 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-2xl backdrop-blur-md text-xs font-bold flex items-center gap-2 border transition duration-300 animate-bounce ${
              toast.type === 'error'
                ? 'bg-rose-900/90 text-rose-200 border-rose-500/50'
                : 'bg-emerald-900/90 text-emerald-200 border-emerald-500/50'
            }`}>
              <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* Developer Rights & Contact Card */}
          <footer className="glass-panel rounded-2xl p-4 text-center mt-2 border-cyan-500/20">
            <div className="flex flex-col items-center gap-2">
              <div className="flex items-center justify-center gap-2.5">
                <div className="w-10 h-10 rounded-full bg-white/10 border border-cyan-400/50 flex items-center justify-center overflow-hidden p-0.5 shadow-md">
                  <img src="gsm_logo.png" onError={(e) => { e.currentTarget.src = "public/assets/gsm_logo.png"; }} alt="عبدالهادي كمال" className="w-full h-full object-cover rounded-full" />
                </div>
                <div>
                  <div className="text-[11px] text-slate-400 font-medium">حقوق التطوير والبرمجة:</div>
                  <div className="text-sm font-extrabold text-white tracking-wide">عبدالهادي كمال</div>
                </div>
              </div>

              <a
                href="mailto:abdelhadi.kamal96@gmail.com"
                className="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-cyan-300 text-xs font-mono transition active:scale-95 shadow-inner"
              >
                <svg className="w-3.5 h-3.5 text-cyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <span>abdelhadi.kamal96@gmail.com</span>
              </a>

              <div className="text-[10px] text-slate-500 font-medium mt-0.5">
                جميع الحقوق محفوظة للمطور ©
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
